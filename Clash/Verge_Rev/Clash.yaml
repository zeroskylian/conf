# Author:https://github.com/Repcz
# TG:https://t.me/QVQ_Channel
# 原地址: https://raw.githubusercontent.com/Repcz/Tool/X/Clash/Meta/Mihomo.yaml
# 原地址: https://raw.githubusercontent.com/luestr/ProxyResource/refs/heads/main/Tool/Clash/Config/Clash_Sample_Configuration_By_iKeLee.yaml
# 官方文档：https://wiki.metacubex.one/
#
# 以 '#' 或 '//' 开头的配置文件行为注释行
#
# Mihomo Version ≥ 1.8.10
#
# 最后更新时间: 2024-12-21
#
# ================

mixed-port: 7893
tcp-concurrent: true
allow-lan: true
ipv6: false
mode: rule
log-level: info
udp: true
unified-delay: true
global-client-fingerprint: chrome
find-process-mode: strict

geodata-mode: false
geodata-loader: standard
geo-auto-update: true
geo-update-interval: 24

geox-url:
  # geoip: "https://mirror.ghproxy.com/https://raw.githubusercontent.com/Loyalsoldier/geoip/release/geoip.dat"
  # geosite: "https://mirror.ghproxy.com/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
  mmdb: "https://geodata.kelee.one/Country-Masaiki.mmdb"
  asn: "https://geodata.kelee.one/GeoLite2-ASN-P3TERX.mmdb"

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - +.v2ex.com

tun:
  enable: true
  stack: mixed
  dns-hijack: [any:53]

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  listen: :1053
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    [
      "*",
      "+.lan",
      "+.local",
      "+.direct",
      "+.msftconnecttest.com",
      "+.msftncsi.com",
    ]
  nameserver: [223.5.5.5, 119.29.29.29]
  nameserver-policy: { "rule-set:AD": rcode://success }

NodeParam:
  &NodeParam {
    type: http,
    interval: 86400,
    health-check:
      {
        enable: true,
        url: http://1.1.1.1/generate_204,
        interval: 1800,
        timeout: 5000,
      },
  }
proxy-providers:
  # 注释
  # Subscribe: # 在此将 "http://your-service-provider" 替换为你的机场订阅，推荐使用 base64 或者 node list
  #   url: http://your-service-provider
  #   <<: *NodeParam
  #   override: # 修改节点前后缀时，需移除前方的 "#" 符号
  #     additional-prefix: "节点前缀"
  #     additional-suffix: "节点后缀"
  Subscribe:
    url: http://your-service-provider
    <<: *NodeParam
    override:
      additional-prefix: "节点前缀"
      additional-suffix: "节点后缀"
  Subscribe2:
    url: http://your-service-provider
    <<: *NodeParam
    override:
      additional-prefix: "节点前缀"
      additional-suffix: "节点后缀"
  #Subscribe3: {url: http://your-service-provider, <<: *NodeParam}
  #Subscribe4: {url: http://your-service-provider, <<: *NodeParam}

# 锚点 - 节点筛选组
FilterHK: &FilterHK '^(?=.*((?i)🇭🇰|香港|(\b(HK|Hong)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)\b))).*$'
FilterTW: &FilterTW '^(?=.*((?i)🇹🇼|台湾|(\b(TW|Tai|Taiwan)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)\b))).*$'
FilterJP: &FilterJP '^(?=.*((?i)🇯🇵|日本|川日|东京|大阪|泉日|埼玉|(\b(JP|Japan)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)\b))).*$'
FilterKR: &FilterKR '^(?=.*((?i)🇰🇷|韩国|韓|首尔|(\b(KR|Korea)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)\b))).*$'
FilterSG: &FilterSG '^(?=.*((?i)🇸🇬|新加坡|狮|(\b(SG|Singapore)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)\b))).*$'
FilterUS: &FilterUS '^(?=.*((?i)🇺🇸|美国|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|(\b(US|United States|USA)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)\b))).*$'
FilterGame: &FilterGame '^(?=.*((?i)游戏|🎮|(\b(GAME)(\d+)?\b)))(?!.*((?i)回国|校园)).*$'
FilterAll: &FilterAll '^(?=.*(.))(?!.*((?i)群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|(\b(USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author)(\d+)?\b|(\d{4}-\d{2}-\d{2}|\dG)))).*$'

# 锚点参数
AllGroup:
  &AllGroup {
    type: select,
    proxies:
      [手动切换, 香港节点, 美国节点, 狮城节点, 日本节点, 台湾节点, DIRECT],
  }
UrlTest:
  &UrlTest {
    type: url-test,
    interval: 6,
    tolerance: 20,
    lazy: true,
    url: "http://www.google.com/blank.html",
    disable-udp: false,
    timeout: 2000,
    max-failed-times: 3,
    hidden: true,
    include-all-providers: true,
  }
Select: &Select { type: select, include-all: true }
FallBack:
  &FallBack {
    type: fallback,
    interval: 6,
    lazy: true,
    url: "http://www.google.com/blank.html",
    disable-udp: false,
    timeout: 2000,
    max-failed-times: 3,
    hidden: true,
    include-all-providers: true,
  }
RuleProviders:
  &RuleProviders {
    type: http,
    behavior: classical,
    format: text,
    interval: 86400,
  }

proxy-groups:
  - {
      name: 手动切换,
      type: select,
      include-all: true,
      proxies: [香港节点, 美国节点, 狮城节点, 日本节点, 台湾节点, DIRECT],
      icon: https://github.com/shindgewongxj/WHATSINStash/raw/main/icon/applesafari.png,
    }
  - {
      name: 国外网站,
      <<: *AllGroup,
      icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png,
    }
  - {
      name: 国际媒体,
      <<: *AllGroup,
      icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/YouTube.png,
    }
  - {
      name: 苹果服务,
      <<: *AllGroup,
      icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Apple_1.png,
    }
  - {
      name: 微软服务,
      <<: *AllGroup,
      icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Microsoft.png,
    }
  - {
      name: 谷歌服务,
      <<: *AllGroup,
      icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Google_Search.png,
    }
  - {
      name: 电报消息,
      <<: *AllGroup,
      icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Telegram.png,
    }
  - {
      name: 推特消息,
      <<: *AllGroup,
      icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Twitter.png,
    }
  - {
      name: AI,
      <<: *AllGroup,
      icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/OpenAI.png,
    }
  - {
      name: 游戏平台,
      <<: *AllGroup,
      icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Game.png,
    }
  - {
      name: Emby,
      <<: *AllGroup,
      include-all: true,
      icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Emby.png,
    }
  - {
      name: Spotify,
      <<: *AllGroup,
      icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Spotify.png,
    }
  - {
      name: 兜底分流,
      <<: *AllGroup,
      icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Final.png,
    }
  - {
      name: 香港节点,
      type: select,
      proxies: [香港手动选择, ⏱香港时延优选, 🚥香港故障转移],
      icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png,
    }
  - {
      name: 美国节点,
      type: select,
      proxies: [美国手动选择, ⏱美国时延优选, 🚥美国故障转移],
      icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png,
    }
  - {
      name: 狮城节点,
      type: select,
      proxies: [狮城手动选择, ⏱狮城时延优选, 🚥狮城故障转移],
      icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Singapore.png,
    }
  - {
      name: 日本节点,
      type: select,
      proxies: [日本手动选择, ⏱日本时延优选, 🚥日本故障转移],
      icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Japan.png,
    }
  - {
      name: 台湾节点,
      type: select,
      proxies: [台湾手动选择, ⏱台湾时延优选, 🚥台湾故障转移],
      icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/China.png,
    }
  - { name: 香港手动选择, <<: *Select, filter: *FilterHK }
  - { name: 美国手动选择, <<: *Select, filter: *FilterUS }
  - { name: 狮城手动选择, <<: *Select, filter: *FilterSG }
  - { name: 日本手动选择, <<: *Select, filter: *FilterJP }
  - { name: 台湾手动选择, <<: *Select, filter: *FilterTW }
  - { name: ⏱香港时延优选, <<: *UrlTest, filter: *FilterHK }
  - { name: ⏱美国时延优选, <<: *UrlTest, filter: *FilterUS }
  - { name: ⏱狮城时延优选, <<: *UrlTest, filter: *FilterSG }
  - { name: ⏱日本时延优选, <<: *UrlTest, filter: *FilterJP }
  - { name: ⏱台湾时延优选, <<: *UrlTest, filter: *FilterTW }
  - { name: 🚥香港故障转移, <<: *FallBack, filter: *FilterHK }
  - { name: 🚥美国故障转移, <<: *FallBack, filter: *FilterUS }
  - { name: 🚥狮城故障转移, <<: *FallBack, filter: *FilterSG }
  - { name: 🚥日本故障转移, <<: *FallBack, filter: *FilterJP }
  - { name: 🚥台湾故障转移, <<: *FallBack, filter: *FilterTW }
