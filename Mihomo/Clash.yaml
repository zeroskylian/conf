# Mihomo 配置：Clash.yaml
# 规则方案：传统规则源，使用 classical / text 规则集
# 基于 Repcz 配置整理：https://github.com/Repcz
# 原作者频道：https://t.me/LUCYChannel_1024
# 原始配置：https://raw.githubusercontent.com/Repcz/Tool/refs/heads/X/mihomo/Client/config.yaml
# 官方文档：https://wiki.metacubex.one/
# 参考上游版本：2026-09-17；适用内核：Mihomo ≥ 1.19.31
#
# 使用前请填写 proxy-providers 中的订阅 URL，未使用的订阅需同步调整引用。
# YAML 注释使用 #；修改规则时请注意从上到下的匹配顺序。
# 最后更新时间：2026-11-05

# 基础设置
mixed-port: 7897
tcp-concurrent: true
allow-lan: true
ipv6: false
mode: rule
log-level: info
udp: true
unified-delay: true
find-process-mode: strict

# 地理数据
geodata-mode: false
geodata-loader: standard
geo-auto-update: true
geo-update-interval: 24

geox-url:
  geoip: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat"
  geosite: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
  mmdb: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb"
  asn: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb"

# 配置持久化
profile:
  store-selected: true
  store-fake-ip: true

# 域名嗅探
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
        - 8443
  force-domain:
    - +.v2ex.com

# TUN 设置
tun:
  enable: true
  stack: mips
  dns-hijack:
    - any:53
  auto-route: true
  auto-detect-interface: true
  strict-route: false

# DNS 设置
dns:
  enable: true
  cache-algorithm: arc
  ipv6: false
  enhanced-mode: fake-ip
  listen: :1053
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*"
    - "+.lan"
    - "+.local"
    - "+.direct"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "+.cmpassport.com"
    - "id6.me"
    - "open.e.189.cn"
    - "mdn.open.wo.cn"
    - "opencloud.wostore.cn"
    - "auth.wosms.cn"
    - "+.10099.com.cn"
    - "lancache.steamcontent.com"
  # 优先使用 Google DNS，失败或未获得 IP 时再查询备用 DNS。
  nameserver:
    - 8.8.8.8
  fallback:
    - 223.5.5.5
    - 119.29.29.29
  fallback-lazy-query: true
  fallback-filter:
    # 不因返回国外 IP 而触发回退。
    geoip: false
    ipcidr: []
  nameserver-policy:
    "rule-set:AD": rcode://success

# 订阅通用参数
NodeParam: &NodeParam
  type: http
  interval: 86400
  health-check:
    enable: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    timeout: 5000
    expected-status: 204

# 节点订阅
proxy-providers:
  Provider1:
    url: ""
    <<: *NodeParam
    override:
      additional-prefix: "[Provider1]"
  Provider2:
    url: ""
    <<: *NodeParam
    override:
      additional-prefix: "[Provider2]"
  Provider3:
    url: ""
    <<: *NodeParam
    override:
      additional-prefix: "[Provider3]"
  Provider4:
    url: ""
    <<: *NodeParam
    override:
      additional-prefix: "[Provider4]"

# 锚点 - 节点筛选组
FilterHK: &FilterHK '^(?=.*((?i)🇭🇰|香港|(\b(HK|Hong)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)\b))).*$'
FilterTW: &FilterTW '^(?=.*((?i)🇹🇼|台湾|(\b(TW|Tai|Taiwan)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)\b))).*$'
FilterJP: &FilterJP '^(?=.*((?i)🇯🇵|日本|川日|东京|大阪|泉日|埼玉|(\b(JP|Japan)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)\b))).*$'
FilterKR: &FilterKR '^(?=.*((?i)🇰🇷|韩国|韓|首尔|(\b(KR|Korea)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)\b))).*$'
FilterSG: &FilterSG '^(?=.*((?i)🇸🇬|新加坡|狮|(\b(SG|Singapore)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)\b))).*$'
FilterUS: &FilterUS '^(?=.*((?i)🇺🇸|美国|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|(\b(US|United States|USA)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)\b))).*$'
FilterHome: &FilterHome "^(?=.*((?i)家宽|home|宽带|broadband))"
FilterAll: &FilterAll '^(?=.*(.))(?!.*((?i)群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|卡顿|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|(\b(USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author)(\d+)?\b|(\d{4}-\d{2}-\d{2}|\dG)))).*$'

# 锚点参数
AllGroup: &AllGroup
  type: select
  proxies:
    - 手动切换
    - 香港节点
    - 美国节点
    - 狮城节点
    - 日本节点
    - 台湾节点
    - 韩国节点
    - 手动节点
    - 家宽
    - DIRECT

AllProvider: &AllProvider
  - Provider1
  - Provider2
  - Provider3
  - Provider4

UrlTest: &UrlTest
  type: url-test
  interval: 300
  tolerance: 20
  lazy: true
  url: "https://www.gstatic.com/generate_204"
  expected-status: 204
  disable-udp: false
  timeout: 2000
  max-failed-times: 3
  hidden: true
  include-all-providers: true

Select: &Select
  type: select
  include-all: true

FallBack: &FallBack
  type: fallback
  interval: 300
  lazy: true
  url: "https://www.gstatic.com/generate_204"
  expected-status: 204
  disable-udp: false
  timeout: 2000
  max-failed-times: 3
  hidden: true
  include-all-providers: true

RuleProviders: &RuleProviders
  type: http
  behavior: classical
  format: text
  interval: 86400

# 策略组
proxy-groups:
  - name: 香港时延优选
    <<: *UrlTest
    filter: *FilterHK
  - name: 美国时延优选
    <<: *UrlTest
    filter: *FilterUS
  - name: 狮城时延优选
    <<: *UrlTest
    filter: *FilterSG
  - name: 日本时延优选
    <<: *UrlTest
    filter: *FilterJP
  - name: 台湾时延优选
    <<: *UrlTest
    filter: *FilterTW
  - name: 韩国时延优选
    <<: *UrlTest
    filter: *FilterKR
  - name: 香港故障转移
    <<: *FallBack
    filter: *FilterHK
  - name: 美国故障转移
    <<: *FallBack
    filter: *FilterUS
  - name: 狮城故障转移
    <<: *FallBack
    filter: *FilterSG
  - name: 日本故障转移
    <<: *FallBack
    filter: *FilterJP
  - name: 台湾故障转移
    <<: *FallBack
    filter: *FilterTW
  - name: 韩国故障转移
    <<: *FallBack
    filter: *FilterKR
  - name: 香港节点
    type: select
    proxies:
      - 香港时延优选
      - 香港故障转移
    icon: https://raw.githubusercontent.com/zeroskylian/conf/main/Icon/country/HongKong.png
    use: *AllProvider
    filter: *FilterHK
  - name: 美国节点
    type: select
    proxies:
      - 美国时延优选
      - 美国故障转移
    icon: https://raw.githubusercontent.com/zeroskylian/conf/main/Icon/country/UnitedStates.png
    use: *AllProvider
    filter: *FilterUS
  - name: 狮城节点
    type: select
    proxies:
      - 狮城时延优选
      - 狮城故障转移
    icon: https://raw.githubusercontent.com/zeroskylian/conf/main/Icon/country/Singapore.png
    use: *AllProvider
    filter: *FilterSG
  - name: 日本节点
    type: select
    proxies:
      - 日本时延优选
      - 日本故障转移
    icon: https://raw.githubusercontent.com/zeroskylian/conf/main/Icon/country/Japan.png
    use: *AllProvider
    filter: *FilterJP
  - name: 台湾节点
    type: select
    proxies:
      - 台湾时延优选
      - 台湾故障转移
    icon: https://raw.githubusercontent.com/zeroskylian/conf/main/Icon/country/China.png
    use: *AllProvider
    filter: *FilterTW
  - name: 韩国节点
    type: select
    proxies:
      - 韩国时延优选
      - 韩国故障转移
    icon: https://raw.githubusercontent.com/zeroskylian/conf/main/Icon/country/Korea.png
    use: *AllProvider
    filter: *FilterKR
  - name: 手动节点
    type: select
    <<: *Select
    filter: *FilterAll
    icon: https://raw.githubusercontent.com/zeroskylian/conf/main/Icon/app/Proxy.png
  - name: 手动切换
    type: select
    include-all: true
    filter: *FilterAll
    proxies:
      - 香港节点
      - 美国节点
      - 狮城节点
      - 日本节点
      - 台湾节点
      - 韩国节点
      - 手动节点
      - 家宽
      - DIRECT
    icon: https://raw.githubusercontent.com/zeroskylian/conf/main/Icon/app/Safari.png
  - name: 家宽
    <<: *Select
    filter: *FilterHome
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Area.png
  - name: 国外网站
    <<: *AllGroup
    icon: https://raw.githubusercontent.com/zeroskylian/conf/main/Icon/app/Global.png
  - name: 国际媒体
    <<: *AllGroup
    icon: https://raw.githubusercontent.com/zeroskylian/conf/main/Icon/app/YouTube.png
  - name: 苹果服务
    <<: *AllGroup
    icon: https://raw.githubusercontent.com/zeroskylian/conf/main/Icon/app/Apple.png
  - name: 微软服务
    <<: *AllGroup
    icon: https://raw.githubusercontent.com/zeroskylian/conf/main/Icon/app/Microsoft.png
  - name: 谷歌服务
    <<: *AllGroup
    icon: https://raw.githubusercontent.com/zeroskylian/conf/main/Icon/app/GoogleSearch.png
  - name: 电报消息
    <<: *AllGroup
    icon: https://raw.githubusercontent.com/zeroskylian/conf/main/Icon/app/Telegram.png
  - name: 推特消息
    <<: *AllGroup
    icon: https://raw.githubusercontent.com/zeroskylian/conf/main/Icon/app/Twitter.png
  - name: AI
    <<: *AllGroup
    icon: https://raw.githubusercontent.com/zeroskylian/conf/main/Icon/app/OpenAI.png
  - name: 游戏平台
    <<: *AllGroup
    icon: https://raw.githubusercontent.com/zeroskylian/conf/main/Icon/app/Game.png
  - name: Emby
    <<: *AllGroup
    icon: https://raw.githubusercontent.com/zeroskylian/conf/main/Icon/app/Emby.png
  - name: Spotify
    hidden: true
    <<: *AllGroup
    icon: https://raw.githubusercontent.com/zeroskylian/conf/main/Icon/app/Spotify.png
  - name: Comic
    <<: *AllGroup
    icon: https://raw.githubusercontent.com/zeroskylian/conf/main/Icon/app/Clubhouse.png
  - name: Pikpak
    <<: *AllGroup
    icon: https://raw.githubusercontent.com/zeroskylian/conf/main/Icon/app/Pikpak.png
  - name: 兜底分流
    <<: *AllGroup
    icon: https://raw.githubusercontent.com/zeroskylian/conf/main/Icon/app/Final.png
  - name: Provider1
    type: select
    use:
      - Provider1
  - name: Provider2
    type: select
    use:
      - Provider2
  - name: Provider3
    type: select
    use:
      - Provider3
  - name: Provider4
    type: select
    use:
      - Provider4

